<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Login Admin UMKM - Panel Operasional Kuliner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
    <link rel="stylesheet" href="style.css?v=8" />
    <style>
      body.auth-body {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        min-height: 100vh !important;
        background-color: #faf8f5 !important;
        padding: 20px !important;
        overflow-y: auto !important;
        position: relative !important;
        isolation: isolate !important;
      }

      body.auth-body::before {
        content: "" !important;
        position: fixed !important;
        inset: -40px !important;
        background-image: url("logo.png") !important;
        background-size: cover !important;
        background-position: center !important;
        background-repeat: no-repeat !important;
        opacity: 0.22 !important;
        filter: blur(24px) brightness(1.12) !important;
        -webkit-filter: blur(24px) brightness(1.12) !important;
        z-index: -1 !important;
        pointer-events: none !important;
      }

      .bg-logo-watermark.auth-watermark-blur {
        position: fixed !important;
        left: 50% !important;
        top: 50% !important;
        right: auto !important;
        bottom: auto !important;
        transform: translate(-50%, -50%) !important;
        width: min(84vh, 88vw) !important;
        height: min(84vh, 88vw) !important;
        background-image: url("logo.png") !important;
        background-size: contain !important;
        background-position: center center !important;
        background-repeat: no-repeat !important;
        opacity: 0.4 !important;
        filter: blur(0.6px) brightness(1.06) contrast(1.26) !important;
        -webkit-filter: blur(0.6px) brightness(1.06) contrast(1.26) !important;
        -webkit-mask-image: radial-gradient(
          circle at 50% 50%,
          #000 48%,
          transparent 70%
        ) !important;
        mask-image: radial-gradient(
          circle at 50% 50%,
          #000 48%,
          transparent 70%
        ) !important;
        z-index: 0 !important;
        pointer-events: none !important;
      }

      .auth-wrapper {
        width: 100% !important;
        max-width: 420px !important;
        position: relative !important;
        z-index: 2 !important;
      }

      .auth-card {
        background: rgba(255, 255, 255, 0.72) !important;
        backdrop-filter: blur(5px) !important;
        -webkit-backdrop-filter: blur(5px) !important;
        padding: 30px 26px !important;
        border-radius: 16px !important;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12) !important;
        border: 1px solid rgba(255, 255, 255, 0.82) !important;
      }

      .auth-card .styled-input {
        background-color: rgba(255, 255, 255, 0.92) !important;
      }

      .forgot-pass-row {
        text-align: right;
        margin-top: -6px;
        margin-bottom: 18px;
      }

      .forgot-pass-link {
        font-size: 13px;
        color: #059669;
        font-weight: 700;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .forgot-pass-link:hover {
        text-decoration: underline;
        color: #047857;
      }

      @media screen and (max-width: 768px) {
        .bg-logo-watermark.auth-watermark-blur {
          width: 96vw !important;
          height: 96vw !important;
          top: 48% !important;
        }
      }
    </style>
  </head>
  <body class="auth-body">
    <div class="bg-logo-watermark auth-watermark-blur"></div>

    <div class="auth-wrapper">
      <!-- FORM LOGIN -->
      <div id="login-box" class="auth-card">
        <div class="auth-logo-header">
          <h2>Login Admin UMKM</h2>
          <p>Masuk ke Panel Operasional Kuliner</p>
        </div>
        <form id="login-form">
          <div class="form-group" style="margin-bottom: 14px">
            <label for="login-username">Username</label>
            <input
              type="text"
              id="login-username"
              class="styled-input"
              placeholder="Username"
              required
            />
          </div>
          <div class="form-group" style="margin-bottom: 12px">
            <label for="login-password">Password</label>
            <input
              type="password"
              id="login-password"
              class="styled-input"
              placeholder="Password"
              required
            />
          </div>
          <div class="forgot-pass-row">
            <a
              href="javascript:void(0)"
              onclick="openForgotPasswordModal()"
              class="forgot-pass-link"
            >
              <i class="fa-solid fa-key"></i> Lupa Password?
            </a>
          </div>
          <button type="submit" id="btn-login-submit" class="btn-auth-blue">
            Login
          </button>
        </form>
        <p class="auth-switch-text">
          Belum punya akun?
          <a href="javascript:void(0)" onclick="toggleAuthForm('register')"
            >Daftar Akun UMKM Baru</a
          >
        </p>
      </div>

      <!-- FORM REGISTER -->
      <div id="register-box" class="auth-card" style="display: none">
        <div class="auth-logo-header">
          <h2>Daftar Akun UMKM Baru</h2>
          <p>Buat akun pengelola usaha kuliner Anda</p>
        </div>
        <form id="register-form">
          <div class="form-group" style="margin-bottom: 12px">
            <label for="reg-store-name">Nama Pemilik / Usaha:</label>
            <input
              type="text"
              id="reg-store-name"
              class="styled-input"
              placeholder="Contoh: Toko Berkah / Budi"
              required
            />
          </div>
          <div class="form-group" style="margin-bottom: 12px">
            <label for="reg-phone">No. HP / WhatsApp (Untuk Reset Password):</label>
            <input
              type="tel"
              id="reg-phone"
              class="styled-input"
              placeholder="Contoh: 081234567890"
              required
            />
          </div>
          <div class="form-group" style="margin-bottom: 12px">
            <label for="reg-username">Username:</label>
            <input
              type="text"
              id="reg-username"
              class="styled-input"
              placeholder="Buat Username"
              required
            />
          </div>
          <div class="form-group" style="margin-bottom: 12px">
            <label for="reg-password">Password:</label>
            <input
              type="password"
              id="reg-password"
              class="styled-input"
              placeholder="Buat Password"
              required
            />
          </div>
          <div class="form-group" style="margin-bottom: 18px">
            <label for="reg-confirm-password">Konfirmasi Password:</label>
            <input
              type="password"
              id="reg-confirm-password"
              class="styled-input"
              placeholder="Ulangi Password"
              required
            />
          </div>
          <button type="submit" id="btn-register-submit" class="btn-auth-green">
            Daftar Sekarang
          </button>
        </form>
        <p class="auth-switch-text">
          Sudah punya akun?
          <a href="javascript:void(0)" onclick="toggleAuthForm('login')"
            >Login di sini</a
          >
        </p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      window.toggleAuthForm = function (mode) {
        const loginBox = document.getElementById("login-box");
        const registerBox = document.getElementById("register-box");
        if (mode === "register") {
          loginBox.style.display = "none";
          registerBox.style.display = "block";
        } else {
          registerBox.style.display = "none";
          loginBox.style.display = "block";
        }
      };
    </script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
      import {
        getFirestore,
        doc,
        getDoc,
        setDoc,
        updateDoc,
      } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyA3x9grxeVu_a1_BFY_1EfEtwA-rGE7LFA",
        authDomain: "manajemen-operasional-umkm.firebaseapp.com",
        projectId: "manajemen-operasional-umkm",
        storageBucket: "manajemen-operasional-umkm.firebasestorage.app",
        messagingSenderId: "139605713066",
        appId: "1:139605713066:web:610a6cc1cb5ba1fd0fb0d3",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // Pastikan akun default 'admin' tersedia di Firestore jika belum ada
      async function ensureDefaultAdmin() {
        const defaultRef = doc(db, "umkm_tenants", "admin");
        const snap = await getDoc(defaultRef);
        if (!snap.exists()) {
          await setDoc(defaultRef, {
            account: {
              storeName: "UMKM Digital Kuliner",
              ownerName: "Administrator Utama",
              username: "admin",
              password: "123",
              phone: "081234567890",
              address: "",
              logoData: "",
            },
            products: [],
            customers: [],
            orders: [],
            expenses: [],
          });
        }
      }

      // HANDLER LOGIN CLOUD
      document
        .getElementById("login-form")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const btn = document.getElementById("btn-login-submit");
          const rawUsername = document
            .getElementById("login-username")
            .value.trim();
          const usernameKey = rawUsername.toLowerCase();
          const password = document.getElementById("login-password").value;

          btn.disabled = true;
          btn.innerText = "Menghubungkan ke Database...";

          try {
            if (usernameKey === "admin") {
              await ensureDefaultAdmin();
            }

            const tenantRef = doc(db, "umkm_tenants", usernameKey);
            const docSnap = await getDoc(tenantRef);

            if (docSnap.exists()) {
              const data = docSnap.data();
              const acc = data.account || {};
              if (acc.password === password) {
                sessionStorage.setItem("umkm_active_tenant", usernameKey);
                window.location.href = "dashboard.html";
                return;
              }
            }

            Swal.fire({
              icon: "error",
              title: "Login Gagal",
              text: "Username atau password salah. Pastikan akun sudah terdaftar.",
              confirmButtonColor: "#2563eb",
            });
          } catch (error) {
            console.error(error);
            Swal.fire({
              icon: "error",
              title: "Koneksi Gagal",
              text: "Gagal terhubung ke server: " + error.message,
              confirmButtonColor: "#ef4444",
            });
          } finally {
            btn.disabled = false;
            btn.innerText = "Login";
          }
        });

      // HANDLER REGISTER CLOUD
      document
        .getElementById("register-form")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const btn = document.getElementById("btn-register-submit");
          const storeName = document
            .getElementById("reg-store-name")
            .value.trim();
          const phone = document.getElementById("reg-phone").value.trim();
          const rawUsername = document
            .getElementById("reg-username")
            .value.trim();
          const usernameKey = rawUsername.toLowerCase();
          const password = document.getElementById("reg-password").value;
          const confirmPassword = document.getElementById(
            "reg-confirm-password",
          ).value;

          if (password !== confirmPassword) {
            Swal.fire({
              icon: "warning",
              title: "Password Tidak Cocok",
              text: "Pastikan konfirmasi password sama dengan password yang dibuat.",
              confirmButtonColor: "#16a34a",
            });
            return;
          }

          btn.disabled = true;
          btn.innerText = "Menyimpan ke Cloud...";

          try {
            const tenantRef = doc(db, "umkm_tenants", usernameKey);
            const existingSnap = await getDoc(tenantRef);

            if (existingSnap.exists()) {
              Swal.fire({
                icon: "error",
                title: "Username Sudah Dipakai",
                text: "Silakan pilih username lain yang belum digunakan.",
                confirmButtonColor: "#ef4444",
              });
              return;
            }

            await setDoc(tenantRef, {
              account: {
                storeName: storeName,
                ownerName: storeName,
                username: rawUsername,
                password: password,
                phone: phone || "-",
                address: "",
                logoData: "",
              },
              products: [],
              customers: [],
              orders: [],
              expenses: [],
            });

            Swal.fire({
              icon: "success",
              title: "Akun Berhasil Dibuat!",
              text: "Silahkan Login",
              confirmButtonColor: "#16a34a",
            }).then(() => {
              document.getElementById("register-form").reset();
              window.toggleAuthForm("login");
              document.getElementById("login-username").value = rawUsername;
            });
          } catch (error) {
            console.error(error);
            Swal.fire({
              icon: "error",
              title: "Gagal Mendaftar",
              text:
                "Terjadi kesalahan saat menyimpan Akun: " + error.message,
              confirmButtonColor: "#ef4444",
            });
          } finally {
            btn.disabled = false;
            btn.innerText = "Daftar Sekarang";
          }
        });

      // FITUR LUPA PASSWORD (VERIFIKASI USERNAME + NO HP TERDAFTAR)
      async function openForgotPasswordModal() {
        const { value: verifyData } = await Swal.fire({
          title:
            '<div class="swal-custom-title"><i class="fa-solid fa-key" style="color:#059669;"></i> Reset Password</div>',
          html: `
            <p style="font-size: 13px; color: #64748b; margin-bottom: 14px;">
              Masukkan <b>Username</b> dan <b>Nomor HP/WhatsApp</b> yang terdaftar pada akun usaha Anda.
            </p>
            <div class="swal-form-group">
              <label>Username Akun:</label>
              <input id="fp-username" type="text" class="swal2-input styled-swal-input" placeholder="Contoh: admin">
            </div>
            <div class="swal-form-group">
              <label>Nomor HP / WhatsApp Terdaftar:</label>
              <input id="fp-phone" type="tel" class="swal2-input styled-swal-input" placeholder="Contoh: 081234567890">
            </div>
          `,
          focusConfirm: false,
          showCancelButton: true,
          confirmButtonText: "Verifikasi Akun",
          cancelButtonText: "Batal",
          confirmButtonColor: "#059669",
          cancelButtonColor: "#64748b",
          customClass: {
            popup: "swal2-popup-modern",
          },
          preConfirm: () => {
            const username = document
              .getElementById("fp-username")
              .value.trim()
              .toLowerCase();
            const phone = document.getElementById("fp-phone").value.trim();
            if (!username || !phone) {
              Swal.showValidationMessage("Username dan Nomor HP wajib diisi!");
              return false;
            }
            return { username, phone };
          },
        });

        if (!verifyData) return;

        Swal.fire({
          title: "Memeriksa Data Akun...",
          allowOutsideClick: false,
          customClass: { popup: "swal2-popup-modern" },
          didOpen: () => Swal.showLoading(),
        });

        try {
          if (verifyData.username === "admin") {
            await ensureDefaultAdmin();
          }

          const tenantRef = doc(db, "umkm_tenants", verifyData.username);
          const tenantSnap = await getDoc(tenantRef);

          if (!tenantSnap.exists()) {
            Swal.fire({
              icon: "error",
              title: "Akun Tidak Ditemukan",
              text: `Username "${verifyData.username}" tidak terdaftar di sistem.`,
              confirmButtonColor: "#ef4444",
              customClass: { popup: "swal2-popup-modern" },
            });
            return;
          }

          const accountData = tenantSnap.data().account || {};
          const savedPhone = (accountData.phone || "").trim();
          const normalizePhone = (num) =>
            num.replace(/[\s\-+]/g, "").replace(/^62/, "0");

          if (
            !savedPhone ||
            savedPhone === "-" ||
            normalizePhone(savedPhone) !== normalizePhone(verifyData.phone)
          ) {
            Swal.fire({
              icon: "error",
              title: "Verifikasi Gagal",
              text: "Nomor HP tidak cocok dengan data yang terdaftar pada akun ini.",
              confirmButtonColor: "#ef4444",
              customClass: { popup: "swal2-popup-modern" },
            });
            return;
          }

          const { value: newPassword } = await Swal.fire({
            icon: "success",
            title: "Akun Terverifikasi!",
            html: `
              <p style="font-size: 13px; color: #334155; margin-bottom: 12px;">
                Halo <b>${accountData.ownerName || verifyData.username}</b> (${accountData.storeName || "UMKM"}), silakan buat password baru:
              </p>
              <div class="swal-form-group">
                <input id="fp-new-pass" type="password" class="swal2-input styled-swal-input" placeholder="Masukkan Password Baru">
              </div>
              <div class="swal-form-group">
                <input id="fp-confirm-pass" type="password" class="swal2-input styled-swal-input" placeholder="Ulangi Password Baru">
              </div>
            `,
            showCancelButton: true,
            confirmButtonText: "Simpan Password Baru",
            cancelButtonText: "Batal",
            confirmButtonColor: "#059669",
            cancelButtonColor: "#64748b",
            customClass: { popup: "swal2-popup-modern" },
            preConfirm: () => {
              const pass1 = document.getElementById("fp-new-pass").value;
              const pass2 = document.getElementById("fp-confirm-pass").value;
              if (!pass1 || pass1.length < 3) {
                Swal.showValidationMessage("Password baru minimal 3 karakter!");
                return false;
              }
              if (pass1 !== pass2) {
                Swal.showValidationMessage("Konfirmasi password tidak cocok!");
                return false;
              }
              return pass1;
            },
          });

          if (!newPassword) return;

          await updateDoc(tenantRef, {
            "account.password": newPassword,
          });

          Swal.fire({
            icon: "success",
            title: "Password Berhasil Direset!",
            text: "Silakan login menggunakan password baru Anda.",
            confirmButtonColor: "#059669",
            customClass: { popup: "swal2-popup-modern" },
          });
        } catch (error) {
          console.error("Error reset password:", error);
          Swal.fire({
            icon: "error",
            title: "Terjadi Kesalahan",
            text: "Gagal terhubung ke server database: " + error.message,
            confirmButtonColor: "#ef4444",
            customClass: { popup: "swal2-popup-modern" },
          });
        }
      }

      window.openForgotPasswordModal = openForgotPasswordModal;
    </script>
  </body>
</html>
