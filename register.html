<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Daftar Akun UMKM - Panel Operasional Kuliner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
    <link rel="stylesheet" href="style.css?v=8" />
  </head>
  <body class="auth-body">
    <div class="bg-logo-watermark auth-watermark-blur"></div>

    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-logo-header">
          <h2>Daftar Akun UMKM Baru</h2>
          <p>Buat akun pengelola usaha kuliner Anda</p>
        </div>
        <form id="register-form">
          <div class="form-group" style="margin-bottom: 12px">
            <label for="reg-nama">Nama Pemilik / Usaha:</label>
            <input
              type="text"
              id="reg-nama"
              class="styled-input"
              required
              placeholder="Contoh: Toko Berkah / Budi"
            />
          </div>
          <div class="form-group" style="margin-bottom: 12px">
            <label for="reg-phone">No. HP / WhatsApp:</label>
            <input
              type="tel"
              id="reg-phone"
              class="styled-input"
              required
              placeholder="Contoh: 081234567890"
            />
          </div>
          <div class="form-group" style="margin-bottom: 12px">
            <label for="reg-username">Username:</label>
            <input
              type="text"
              id="reg-username"
              class="styled-input"
              required
              placeholder="Buat Username"
            />
          </div>
          <div class="form-group" style="margin-bottom: 12px">
            <label for="reg-password">Password:</label>
            <input
              type="password"
              id="reg-password"
              class="styled-input"
              required
              placeholder="Buat Password"
            />
          </div>
          <div class="form-group" style="margin-bottom: 18px">
            <label for="reg-confirm">Konfirmasi Password:</label>
            <input
              type="password"
              id="reg-confirm"
              class="styled-input"
              required
              placeholder="Ulangi Password"
            />
          </div>
          <button type="submit" id="btn-register-submit" class="btn-auth-green">
            Daftar Sekarang
          </button>
        </form>
        <p class="auth-switch-text">
          Sudah punya akun? <a href="index.html">Login di sini</a>
        </p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="auth.js"></script>
  </body>
</html>
